<main>

<section class="formulario-contenedor">

    <h2>Contactanos</h2>

    <form id="formulario-contacto">

        <div class="campo">
            <label>Nombre:</label>
            <input type="text" id="contacto-nombre">

            <small id="error-contacto-nombre"></small>
        </div>

        <div class="campo">
            <label>Correo:</label>
            <input type="email" id="contacto-correo">

            <small id="error-contacto-correo"></small>
        </div>

        <div class="campo">
            <label>Comentario:</label>

            <textarea id="comentario"></textarea>

            <small id="error-comentario"></small>
        </div>

        <button type="submit">Enviar mensaje</button>

    </form>

</section>
