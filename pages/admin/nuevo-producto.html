<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Nuevo Producto</title>

    <link rel="stylesheet"
          href="../../css/style.css">

    <link rel="stylesheet"
          href="../../css/admin.css">

</head>

<body>

<div class="admin-container">

    <aside class="admin-menu">

        <h2> Futbolmania</h2>

        <a href="index.html">Inicio</a>

        <a href="productos.html">
            Productos
        </a>

        <a href="nuevo-producto.html">
            Nuevo producto
        </a>

        <a href="usuarios.html">
            Usuarios
        </a>

    </aside>


    <main class="admin-contenido">

        <h1>Crear nuevo producto</h1>

        <form id="formulario-producto">

            <div class="campo">

                <label>Codigo:</label>

                <input type="text" id="codigo">

            </div>


            <div class="campo">

                <label>Nombre:</label>

                <input type="text" id="nombre">

            </div>


            <div class="campo">

                <label>Descripcion:</label>

                <textarea id="descripcion"></textarea>

            </div>


            <div class="campo">

                <label>Precio:</label>

                <input type="number"
                       id="precio"
                       min="0"
                       step="0.01">

            </div>


            <div class="campo">

                <label>Stock:</label>

                <input type="number"
                       id="stock"
                       min="0">

            </div>


            <div class="campo">

                <label>Stock critico:</label>

                <input type="number"
                       id="stockCritico"
                       min="0">

            </div>


            <div class="campo">

                <label>Categoria:</label>

                <select id="categoria">

                    <option value="">
                        Seleccione
                    </option>

                    <option>
                        Camisetas
                    </option>

                    <option>
                        Balones
                    </option>

                    <option>
                        Botines
                    </option>

                    <option>
                        Accesorios
                    </option>

                </select>

            </div>


            <div class="campo">

                <label>Imagen:</label>

                <input type="text" id="imagen" placeholder="Nombre del archivo en img/ (opcional)">

            </div>


            <button type="submit">
                Guardar producto
            </button>

        </form>

    </main>

</div>

<script src="../../js/admin-productos.js"></script>

</body>
</html>
