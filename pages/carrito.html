<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Futbolmania</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>

    <nav>

        <h1> FUTBOLMANIA</h1>

        <ul>

            <li><a href="../index.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="nosotros.html">Nosotros</a></li>
            <li><a href="blogs.html">Blog</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="carrito.html"> Carrito</a></li>

        </ul>

    </nav>

</header>

<main>

<section class="productos-destacados">

<h2>Mi carrito</h2>

<div id="carrito-container" class="productos-container"></div>

<h3 id="total"></h3>

<div class="campo">
    <label for="direccion-entrega">Dirección de entrega</label>
    <textarea
        id="direccion-entrega"
        maxlength="300"
        placeholder="Ingresa la dirección para el despacho a domicilio"
    ></textarea>
    <small id="error-direccion-entrega"></small>
</div>

<button onclick="vaciarCarrito()">
    Vaciar carrito
</button>

<button onclick="mostrarResumenCompra()">
    Pagar
</button>

</section>

<div id="resumen-modal" class="modal" style="display: none;">

    <div class="modal-contenido">

        <h2>Resumen de compra</h2>

        <div id="resumen-container"></div>

<h3 id="resumen-total"></h3>

<p id="resumen-direccion"></p>

<button onclick="cerrarResumen()">
    Cerrar
</button>

        <button onclick="confirmarPago()">
            Confirmar pago
        </button>

    </div>

</div>

</main>

<footer>
    <p>© 2026 Futbolmania</p>
</footer>

<script src="../js/carrito.js"></script>

</body>
</html>
