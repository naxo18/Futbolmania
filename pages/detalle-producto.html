<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle producto - Futbolmania</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>

    <nav>

        <h1> FUTBOLMANIA</h1>

        <ul>

            <li><a href="../index.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="nosotros.html">Nosotros</a></li>
            <li><a href="blogs.html">Blog</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="carrito.html"> Carrito</a></li>

        </ul>

    </nav>

</header>

<main>

<section class="formulario-contenedor" id="detalle-producto">

    <h2>Cargando producto...</h2>

</section>

</main>

<footer>
    <p>© 2026 Futbolmania</p>
</footer>

<script src="../js/carrito.js"></script>
<script src="../js/productos.js"></script>

<script>

const params = new URLSearchParams(window.location.search);

const id = Number(params.get("id")) || 1;

const productoDetalle = productos.find(
    p => p.id === id
);

const contenedorDetalle =
    document.getElementById("detalle-producto");

if (productoDetalle) {

    contenedorDetalle.innerHTML = `

        <img src="${productoDetalle.imagen}"
             alt="${productoDetalle.nombre}">

        <h2>${productoDetalle.nombre}</h2>

        <p>
            Producto deportivo ideal para los fanaticos
            del futbol.
        </p>

        <h3>$${productoDetalle.precio}</h3>

        <button onclick="agregarCarrito(${productoDetalle.id})">
            Añadir al carrito
        </button>

    `;

}
else {

    contenedorDetalle.innerHTML = `
        <h2>Producto no encontrado</h2>
    `;

}

</script>

</body>
</html>
